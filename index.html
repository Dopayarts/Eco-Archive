<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco-Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage"><canvas id="garden" width="240" height="160" aria-label="Eco-Archive garden. Click a plant to inspect it."></canvas>
    <div id="plots" role="group" aria-label="Plots">
      <button data-plot="-1" title="Previous plot">[&lt;]</button><span id="plot">PLOT 1/1</span><button data-plot="1" title="Next plot">[&gt;]</button>
    </div>
    <div id="scenes" role="group" aria-label="Preview a season">
      <button data-scene="rainy" title="See the last rainy season for 5 seconds">[LAST RAINY]</button>
      <button data-scene="dry" title="See the last dry season for 5 seconds">[LAST DRY]</button>
      <button data-scene="now" class="on" title="Back to the present">[NOW]</button>
    </div></main>
  <aside id="term">
    <div class="bar"><span>ECO-ARCHIVE.OS</span><span id="clk"></span></div>
    <div id="viewer" hidden>
      <canvas id="turn" width="128" height="128" title="Drag to spin"></canvas>
      <div class="btns">
        <button data-mode="plant">[PLANT]</button>
        <button data-mode="leaf">[LEAF]</button>
        <button data-mode="photo" hidden>[PHOTO]</button>
        <button data-mode="flower" hidden>[FLOWER]</button>
        <button data-close onclick="EA.panel.select(null)" title="Close this record">[CLOSE]</button>
      </div>
    </div>
    <nav id="tabs" hidden>
      <button data-tab="info">[INFO]</button><button data-tab="uses">[USES]</button><button data-tab="history">[HISTORY]</button><button data-tab="cycle">[CYCLE]</button>
    </nav>
    <div id="out" aria-live="polite"></div>
    <form id="cmd" autocomplete="off"><label for="in">&gt;</label><input id="in" spellcheck="false" placeholder="type help"></form>
  </aside>
</div>
<div id="admin" hidden role="dialog" aria-label="Eco-Archive admin"></div>
<script src="js/core.js"></script>
<script src="js/species.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="js/archive.js"></script>
<script src="specimens/index.js"></script>
<script src="plants/index.js"></script>
<script src="js/model.js"></script>
<script src="js/scene.js"></script>
<script src="js/garden.js"></script>
<script src="js/birds.js"></script>
<script src="js/panel.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
